<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ShopEasy</title>
    <link rel="stylesheet" href="exp6.css">
</head>
<body>
    <div class="heading">
        <h1>ShopEasy</h1>
    </div>

    <div class="outer">
        <div class="parent">

            <div class="logo">
                <div class="border">
                    <img src="shopping.jpg" class="photo" alt="ShopEasy Logo">
                </div>
            </div>

            <div class="price">
                <h2><b>Classic Cotton T-Shirt</b></h2>
                <p>Soft, breathable cotton. Regular fit. Available in multiple colors.</p>

                <div class="price-section">
                    <span><b>₹799</b></span>
                    <span id="price">₹1,199</span>
                </div>

                <button class="buy-button">Add to Cart</button>
            </div>

        </div>
    </div>

</body>
</html>
